{% extends "base.html" %}
{% block title %}Register | CyberPy Labs{% endblock %}
{% block content %}

<section>
  <h2 class="title">Create your account</h2>
  <p class="subtitle">Register to pick up right where you left off.</p>

  <div class="login-wrap">
    <div class="login-card">
      <svg class="login-icon" viewBox="0 0 24 24" fill="none" stroke="#00E5FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M19 8v6M22 11h-6"/>
      </svg>

      {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

      <form method="post" action="/register">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" value="{{ form_values.get('name', '') }}" required autofocus>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" value="{{ form_values.get('email', '') }}" placeholder="Optional if mobile is provided">
        </div>
        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <input type="tel" id="mobile" name="mobile" value="{{ form_values.get('mobile', '') }}" placeholder="Optional if email is provided">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <button type="submit" class="btn" style="width:100%;">Create Account</button>
      </form>
    </div>
    <p class="login-switch">Already have an account? <a href="/login">Log in</a></p>
    <a href="/" class="login-back">← Back to home</a>
  </div>
</section>

{% endblock %}
