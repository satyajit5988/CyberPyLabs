{% extends "base.html" %}
{% block title %}Login | CyberPy Labs{% endblock %}
{% block content %}

<section>
  <h2 class="title">Login</h2>
  <p class="subtitle">Log in to see your dashboard.</p>

  <div class="login-wrap">
    <div class="login-card">
      <svg class="login-icon" viewBox="0 0 24 24" fill="none" stroke="#00E5FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="10" width="16" height="10" rx="2"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      </svg>

      {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

      <form method="post" action="/login">
        <div class="form-group">
          <label for="identifier">Username, Email, or Mobile Number</label>
          <input type="text" id="identifier" name="identifier" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn" style="width:100%;">Log In</button>
      </form>
    </div>
    <p class="login-switch">Don't have an account? <a href="/register">Register</a></p>
    <a href="/" class="login-back">← Back to home</a>
  </div>
</section>

{% endblock %}
