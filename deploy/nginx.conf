# Nginx site config for CyberPy Labs
#
# Installed at /etc/nginx/sites-available/cyberpylabs by setup-server.sh,
# symlinked into sites-enabled. Replace YOUR_DOMAIN below before running
# setup-server.sh (or the script does this substitution for you).
#
# After DNS points at this server, run:
#   sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
# Certbot rewrites this file to add the HTTPS server block and
# auto-redirect - you don't need to hand-write TLS config here.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    client_max_body_size 10M;

    location /static/ {
        alias /opt/cyberpylabs/app/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
